# Стадия 0: PR → tests + агентский ревью-гейт.
# Гейт fail-closed: агент не вернул approve → job падает → branch protection не даёт мержить.

name: CI + Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # TODO: подставьте команды своего стека (pip/poetry/go test/cargo test ...)
      # Демо-приложение живёт в app/ — замените на своё.
      - run: npm ci
        working-directory: app
      - run: npm run lint --if-present
        working-directory: app
      - run: npm test --if-present
        working-directory: app
      - run: npm run build --if-present
        working-directory: app

  agent-review:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/diff.patch

      # Backend heur работает без внешних секретов. Для LLM-агента (backend=cli)
      # раскомментируйте установку CLI и задайте AGENT_CMD/AGENT_API_KEY:
      # - name: Install agent CLI
      #   run: npm i -g @zcode/cli

      - name: Agent review
        env:
          AGENT_BACKEND: '${{ vars.AGENT_BACKEND }}'
          AGENT_CMD: '${{ vars.AGENT_CMD }}'
          AGENT_API_KEY: '${{ secrets.AGENT_API_KEY }}'
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.OPENAI_MODEL }}'
          OPENAI_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}'
          AGENT_FALLBACK: '${{ vars.AGENT_FALLBACK }}'
          AGENT_MAX_ATTEMPTS: '3'
        run: bash scripts/agent.sh prompts/review.md verdict.json /tmp/diff.patch

      - name: Gate (fail-closed)
        run: bash scripts/gate.sh verdict.json approve

      - name: PR comment
        if: always()
        env:
          GH_TOKEN: '${{ github.token }}'
          PR: '${{ github.event.number }}'
        run: |
          set +e
          {
            echo "### 🤖 Agent review"
            if [[ -s verdict.json ]]; then
              jq -r '"verdict: **\(.verdict)** · risk: **\(.risk // "n/a")** · \(.summary // "")"' verdict.json
              jq -r '.blockers[]?  | "- 🚫 \(.)"' verdict.json
              jq -r '.suggestions[]? | "- 💡 \(.)"' verdict.json
            else
              echo "⚠️ Агент не вернул валидный JSON — гейт упал (fail-closed)."
            fi
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: agent-verdict, path: verdict.json, if-no-files-found: ignore }
